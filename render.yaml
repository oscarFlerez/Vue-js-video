services:
  - type: web
    name: user-crud-vuejs-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: API_PROXY_TARGET
        value: https://users-management-api-orb0.onrender.com
      - key: NODE_VERSION
        value: 22.12.0
    healthCheckPath: /health
    autoDeploy: true