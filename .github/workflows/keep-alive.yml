name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:          # ejecucion manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_URL secret no configurado; saltando."
            exit 0
          fi
          curl -fsS --max-time 60 "$URL" >/dev/null || true
          echo "Ping enviado a $URL"